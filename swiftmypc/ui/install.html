<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Install SwiftMyPC</title>
  <link rel="stylesheet" href="styles.css">
  <script src="icons.js"></script>
  <style>
    body { display: block; background: var(--bg); }
    .wrap {
      position: relative; height: 100%; padding: 26px 28px 22px;
      display: flex; flex-direction: column;
      background:
        radial-gradient(90% 70% at 0% 0%, rgba(109, 92, 255, 0.2), transparent 60%),
        radial-gradient(70% 60% at 100% 100%, rgba(61, 139, 255, 0.12), transparent 60%);
    }
    .top { display: flex; align-items: center; gap: 16px; }
    .top h1 { margin: 2px 0 0; font: 700 22px/1.15 var(--font-display); letter-spacing: -0.02em; }
    .lead-text { margin: 16px 0 14px; color: var(--muted); }
    ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
    li { display: flex; align-items: center; gap: 10px; }
    li .ico { width: 26px; height: 26px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
    .check { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 10px 2px; color: var(--muted); cursor: pointer; }
    .foot { display: flex; gap: 10px; padding-top: 12px; }
    .foot .left { margin-right: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo big" style="width:58px;height:58px"><i style="width:40px;height:40px;border-radius:12px"></i><i id="mark" style="width:40px;height:40px;border-radius:12px"></i></div>
      <div><span class="eyebrow" id="eyebrow"></span><h1 id="title"></h1></div>
    </div>
    <p class="lead-text" id="text"></p>
    <ul id="points"></ul>
    <div class="check" id="delete-row" role="switch" tabindex="0"><span class="toggle on" id="delete-toggle"></span>Delete this downloaded file afterwards</div>
    <div class="foot" id="foot"></div>
  </div>
  <script>
    'use strict';
    let deleteDownload = true;
    const el = (id) => document.getElementById(id);
    function btn(text, cls, choice) {
      const b = document.createElement('button');
      b.className = 'btn ' + cls;
      b.textContent = text;
      b.onclick = () => window.pywebview.api.choose(choice, deleteDownload);
      return b;
    }
    function flip() {
      deleteDownload = !deleteDownload;
      el('delete-toggle').classList.toggle('on', deleteDownload);
      el('delete-row').setAttribute('aria-checked', String(deleteDownload));
    }
    el('delete-row').onclick = flip;
    el('delete-row').onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
    async function start() {
      const info = await window.pywebview.api.info();
      if (info.dark) document.documentElement.setAttribute('data-theme', 'dark');
      el('mark').style.display = 'grid'; el('mark').style.placeItems = 'center';
      el('mark').append(window.icon('zap', 22));
      const cmp = (a, b) => { const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
        for (let i = 0; i < 3; i++) if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0); return 0; };
      const foot = el('foot');
      foot.append(btn('Just run it once', 'left', 'run'));
      if (!info.installed) {
        el('eyebrow').textContent = 'Welcome';
        el('title').textContent = 'Install SwiftMyPC?';
        el('text').textContent = 'It installs for your account. No administrator rights are needed.';
        foot.append(btn('Install', 'btn-primary', 'install'));
      } else if (info.installed === 'unknown' || cmp(info.installed, info.version) < 0) {
        el('eyebrow').textContent = 'New version';
        el('title').textContent = `Update to ${info.version}?`;
        el('text').textContent = `You have version ${info.installed}. This replaces it, so only one copy stays on your PC. Your settings are kept.`;
        foot.append(btn('Update', 'btn-primary', 'install'));
      } else {
        el('eyebrow').textContent = 'Already installed';
        el('title').textContent = `SwiftMyPC ${info.installed} is installed`;
        el('text').textContent = 'Open the installed copy, or reinstall this version over it.';
        foot.append(btn('Reinstall', '', 'install'), btn('Open SwiftMyPC', 'btn-primary', 'open'));
      }
      for (const [icon, text] of [['desktop', 'Shortcuts on your Desktop and in the Start menu'],
                                  ['refresh', 'Updates itself when a new version comes out'],
                                  ['trash', 'Remove it any time from Settings › Apps']]) {
        const li = document.createElement('li');
        li.append(window.icon(icon, 15), text);
        el('points').append(li);
      }
    }
    window.addEventListener('pywebviewready', start, { once: true });
  </script>
</body>
</html>
