<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwiftMyPC</title>
  <link rel="stylesheet" href="styles.css">
  <script src="icons.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><i></i><i id="logo-mark"></i></div>
      <div><strong>SwiftMyPC</strong><small>Keep your PC quick</small></div>
    </div>
    <nav class="nav" id="nav-main" aria-label="Pages"></nav>
    <div class="grow"></div>
    <div class="sidebar-foot">
      <button class="update-pill" id="update-pill" hidden></button>
      <button class="ghost-link" id="admin-link" hidden></button>
      <div class="admin-badge" id="admin-badge" hidden></div>
      <nav class="nav" id="nav-foot" aria-label="More"></nav>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <label class="search" id="search-box">
        <span id="search-ico"></span>
        <input id="search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
        <kbd>Ctrl F</kbd>
      </label>
      <div class="spacer"></div>
      <button class="icon-btn theme-toggle" id="theme-btn" title="Switch theme"></button>
    </header>
    <div class="page-head">
      <div class="page-title"><h1 id="page-h1"></h1><p id="page-sub"></p></div>
      <div class="page-actions" id="page-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
